<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c3ccd3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a2229" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">

<title>HRM by MD</title>
<link rel="stylesheet" href="/css/base.css?v=1"><link rel="stylesheet" href="/css/layout.css?v=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/bubble.css?v=1">
<link rel="stylesheet" href="/css/components.css?v=1">
<link rel="stylesheet" href="/css/profile.css?v=1">
<link rel="preload" as="image" href="/hero.webp" type="image/webp">
</head>
<body>
<div class="wrap">
  <button class="th" id="thm" aria-label="Theme">◐</button>
  <div class="stage" id="st"><div class="tilt" id="tl"><div class="art"><b class="spec"></b><b class="shn"></b></div><div class="halo"></div><div class="fx"><i class="gl"></i><i class="wf"></i><i class="wf b"></i><i class="ms"></i><i class="fm"></i><b class="bb" style="--x:21.5%;--d:0s;--dx:-6px"></b><b class="bb" style="--x:23.5%;--d:0.4s;--dx:4px"></b><b class="bb" style="--x:25.5%;--d:0.9s;--dx:-3px"></b><b class="bb" style="--x:27.5%;--d:1.3s;--dx:7px"></b><b class="bb" style="--x:29%;--d:1.7s;--dx:-5px"></b><b class="bb" style="--x:24.5%;--d:2s;--dx:5px"></b><i class="pg"></i><i class="rp"></i><i class="rp b"></i><div class="cl" id="cl"><i class="tk"></i><i class="hh" id="ckh"></i><i class="mh" id="ckm"></i><i class="sh" id="cks"></i><i class="cp"></i></div><b class="sk" style="--x:52%;--y:83.5%;--d:0s"></b><b class="sk" style="--x:58.5%;--y:82%;--d:0.5s"></b><b class="sk" style="--x:66%;--y:84.5%;--d:1.0s"></b><b class="sk" style="--x:72%;--y:82.5%;--d:1.5s"></b><b class="sk" style="--x:78%;--y:84%;--d:0.8s"></b><b class="sk" style="--x:83%;--y:82%;--d:2.0s"></b><i class="dt" style="--x:9%;--y:44%;--d:0s;--t:7s"></i><i class="dt" style="--x:13%;--y:32%;--d:2.5s;--t:8s"></i><i class="dt" style="--x:7%;--y:24%;--d:4s;--t:6.5s"></i><i class="dt" style="--x:90%;--y:38%;--d:1s;--t:7.5s"></i><i class="dt" style="--x:87%;--y:26%;--d:3.2s;--t:8s"></i><i class="dt" style="--x:92%;--y:50%;--d:5s;--t:6.8s"></i><i class="dt" style="--x:18%;--y:52%;--d:1.8s;--t:9s"></i><i class="dt" style="--x:83%;--y:46%;--d:4.4s;--t:7.2s"></i></div><div class="lyr" style="--z:22px"><div class="c2"></div></div><div class="lyr" style="--z:46px"><div class="c1"></div></div><div class="ring"></div><div class="orbit"><i style="--r:calc(var(--w)*.27);--t:8s;--o:-0s"></i><i style="--r:calc(var(--w)*.27);--t:8s;--o:-4s"></i><i style="--r:calc(var(--w)*.33);--t:12s;--o:-3s"></i><i style="--r:calc(var(--w)*.33);--t:12s;--o:-9s"></i></div></div><div class="gs"></div></div>
<span class="brand">PRAN-RFL · HRM by MD</span>
  <p class="tag">Dear Sir ~ Welcome to Our Site ✨</p>
  <!-- LOGIN -->
  <div class="card rise" id="loginCard">
    <div class="rgbox" id="rgbox"><svg id="rg" viewBox="0 0 340 172" role="img" aria-label="Login machine">
      <!-- ceiling + pulley -->
      <path class="ln" d="M18 6H62M40 6V28"/>
      <g id="pul" transform="translate(40 28)"><circle class="ln gd" r="11"/><path class="ln" d="M-11 0H11M0 -11V11"/><circle class="fl" r="2.5"/></g>
      <!-- belt to the gears -->
      <path id="belt" class="ln ac" stroke-dasharray="5 4" d="M44 17L242 38"/>
      <!-- rope + weights -->
      <line id="rl" class="ln" x1="29" y1="28" x2="29" y2="100"/>
      <line id="rr" class="ln" x1="51" y1="28" x2="51" y2="56"/>
      <g id="w1" transform="translate(29 100)"><circle class="ln" cx="0" cy="3" r="3"/><circle class="fl" cx="0" cy="13" r="9"/></g>
      <g id="w2" transform="translate(51 56)"><path class="fl" style="fill:var(--teal)" d="M-6 0L6 0L0 11Z"/></g>
      <!-- gauge (password) -->
      <path class="ln" d="M20 142A20 20 0 0 1 60 142Z"/>
      <path class="ln" d="M24 134L27 136M40 125V129M56 134L53 136"/>
      <g id="nd" transform="translate(40 142) rotate(-80)"><line class="ln gd" x1="0" y1="0" x2="0" y2="-16" style="stroke-width:2.2"/></g>
      <circle class="fl" cx="40" cy="142" r="2.5"/>
      <text x="40" y="158">PASSWORD</text>
      <!-- gears -->
      <g id="g1" transform="translate(284 40)"><path id="g1p" class="ln gd" d=""/><circle class="ln" r="15"/><path class="ln" d="M0 -15V15M-13 -7.5L13 7.5M-13 7.5L13 -7.5"/><circle class="fl" r="3"/></g>
      <g id="g2" transform="translate(247 52)"><path id="g2p" class="ln gd" d=""/><circle class="ln" r="7"/><path class="ln" d="M-7 0H7M0 -7V7"/><circle class="fl" r="2.5"/></g>
      <!-- ramp + latch -->
      <path class="ln" d="M88 70L218 138M88 70V132M218 138V150"/>
      <line id="pin" class="ln ac" x1="110" y1="82" x2="110" y2="66" style="stroke-width:2.4"/>
      <!-- ground -->
      <path class="ln" d="M70 150H330" style="opacity:.5"/>
      <!-- domino, rod, lamp -->
      <rect id="dom" x="230" y="126" width="6" height="24" rx="1" class="fl"/>
      <g id="rod"><path class="ln gd" d="M243 143H289"/><circle class="fl" cx="289" cy="143" r="2.2"/></g>
      <path class="ln" d="M314 143V150"/>
      <circle id="lamp" class="ln" cx="314" cy="134" r="9"/>
      <text id="lt" x="314" y="137" style="font-size:11px;fill:var(--card)"></text>
      <!-- ball -->
      <g id="ball" transform="translate(100 69.5)"><circle r="6" style="fill:var(--gold);stroke:var(--ink);stroke-width:1.4"/><path d="M-6 0H6M0 -6V6" style="stroke:var(--ink);stroke-width:1;opacity:.5"/></g>
      <text x="154" y="62">ID ⟶ weight lifts</text>
    </svg><div class="rgcap" id="rgcap">⚙️ Type ID &amp; password, the machine follows you</div></div>
    <label>🗓️ HRIS User ID</label>
    <input id="uid" placeholder="Enter your Staff ID" autocomplete="username" autocapitalize="characters">
    <label>🔐 HRIS Password</label>
    <input id="pwd" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go">Login</button>
    <div class="err" id="loginErr"></div>
    <p class="note">🔒 Your ID and password are never saved. They are only sent to sign in to HRIS. This site is view-only and never applies or saves anything.</p>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="tabwrap"><div class="tabs" id="tabs">
      <button class="tab on" data-t="attendance" data-c="#fbeaa8">📅 Attendance</button>
      <button class="tab" data-t="balance" data-c="#cdeedd">🏖️ Leave</button>
      <button class="tab" data-t="payslip" data-c="#e2d9fb">💰 Salary</button>
      <button class="tab" data-t="purchase" data-c="#ffd9c2">🍽️ Canteen</button>
      <button class="tab" data-t="trend" data-c="#cfe6fb">📈 Trend</button>
      <button class="tab" data-t="limit" data-c="#fde7b0">🛒 Limit</button>
      <button class="tab" data-t="iom" data-c="#fbd0dc">🕘 IOM</button>
      <button class="tab" data-t="profile" data-c="#c9f0e0">👤 Profile</button>
    </div><div class="drop" id="drop" aria-hidden="true"></div></div>
    <div class="card" id="barCard">
      <div class="bar">
        <div><label>Month</label><select id="month"></select></div>
        <div><label>Year</label><input id="year" type="number"></div>
        <button id="load">Show</button>
      </div>
    </div>
    <div class="err" id="err"></div>
    <div id="out"></div>
    <button class="link" id="logout">Logout</button>
  </div>
</div>

<script src="/js/app.js?v=1"></script>

<script src="/js/machine.js?v=1"></script>
<script src="/js/glass.js?v=1"></script>
<script src="/js/clock.js?v=1"></script>
</body>
</html>
