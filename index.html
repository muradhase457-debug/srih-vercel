<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ece3d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SRIH">
<title>SRIH - HRIS Viewer</title>
<style>
  :root{color-scheme:light dark;
    --bg:#ece3d4;--card:#f9f3e7;--text:#000;--muted:#262626;--line:#2c4a7c;
    --brand:#2c4a7c;--gold:#f2b632;--cyan:#1b8fb8;--thread:#c8283d;
    --green:#0f7a38;--red:#b4162c;--amber:#8a5200;--blue:#1d4f9c;--purple:#6025c9;
    --denim:#2c4a7c;--denim2:#3e66a3;
    --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .22 0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    --weave:repeating-linear-gradient(45deg,var(--denim) 0 2px,var(--denim2) 2px 4px);}
  @media (prefers-color-scheme:dark){:root{
    --bg:#0c0e14;--card:#161a25;--text:#fff;--muted:#d3d9e6;--line:#4a78bd;
    --brand:#6ea2f0;--gold:#f2b632;--cyan:#4fc3e8;--thread:#e04456;
    --green:#4ade80;--red:#ff7b8a;--amber:#fbbf24;--blue:#8db8ff;--purple:#c4a5ff;
    --denim:#27406b;--denim2:#35588f;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;background:var(--noise),var(--bg);color:var(--text);padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));min-height:100vh}
  .wrap{max-width:600px;margin:0 auto}
  header{text-align:center;margin:10px 0 18px}
  header h1{display:inline-block;margin:0;padding:6px 26px 8px;font-size:30px;font-weight:900;letter-spacing:4px;color:var(--text);text-shadow:2px 2px 0 var(--denim2);border:5px solid transparent;border-radius:18px;background:var(--noise) padding-box,linear-gradient(var(--card),var(--card)) padding-box,var(--weave) border-box;outline:2px dashed var(--gold);outline-offset:-9px}
  header p{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:600}
  .card{position:relative;background:var(--noise) padding-box,linear-gradient(var(--card),var(--card)) padding-box,var(--weave) border-box;border:6px solid transparent;border-radius:24px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.28);margin-bottom:16px}
  .card::before{content:"";position:absolute;inset:3px;border:2px dashed var(--gold);border-radius:16px;opacity:.75;pointer-events:none}
  .card>*{position:relative}
  label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
  input::placeholder{color:var(--muted);opacity:.65}
  input:focus-visible,select:focus-visible,button:focus-visible,.ext:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  button{width:100%;margin-top:14px;padding:13px;border:2px solid #000;border-radius:14px;background:var(--gold);color:#000;font:inherit;font-weight:900;font-size:15px;cursor:pointer;outline:2px dashed rgba(0,0,0,.55);outline-offset:-6px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
  button:disabled{opacity:.6}
  .note{font-size:11px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.5}
  .err{background:rgba(224,68,86,.22);color:var(--text);border:2px dashed var(--thread);padding:10px 12px;border-radius:14px;font-size:13px;margin-top:12px;display:none}
  .name{font-size:19px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{border-radius:16px;padding:12px 6px;text-align:center;font-size:11px;font-weight:800;outline:2px dashed currentColor;outline-offset:-6px}
  .stat b{display:block;font-size:22px;margin-top:2px}
  .g{background:rgba(22,163,74,.16);color:var(--green)}.r{background:rgba(220,38,38,.16);color:var(--red)}
  .a{background:rgba(217,119,6,.18);color:var(--amber)}.b{background:rgba(37,99,235,.16);color:var(--blue)}
  .p{background:rgba(124,58,237,.16);color:var(--purple)}.s{background:rgba(100,116,139,.2);color:var(--muted)}
  .tw{max-height:55vh;overflow:auto;margin-top:14px;border-radius:14px;border:2px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{position:sticky;top:0;background:var(--card);text-align:left;padding:10px 8px;color:var(--text);font-weight:900;border-bottom:2px dashed var(--gold)}
  td{padding:10px 8px;border-bottom:1px dashed var(--line);white-space:nowrap;color:var(--text)}
  td.n{text-align:right}
  tr.present td.st{color:var(--green)}tr.absent{background:rgba(220,38,38,.12)}tr.absent td.st{color:var(--red)}
  tr.off{background:rgba(37,99,235,.12)}tr.off td.st{color:var(--blue)}tr.other td.st{color:var(--amber)}
  td.st{font-weight:900}
  #app{display:none}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1;min-width:max-content;margin:0;padding:10px 14px;background:var(--noise),var(--card);color:var(--text);border:2px solid var(--line);border-radius:14px;font-size:13px;outline:2px dashed var(--line);outline-offset:-6px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .tab.on{background:var(--gold);color:#000;border-color:#000;outline-color:rgba(0,0,0,.55)}
  .bar{display:flex;gap:8px;align-items:flex-end}.bar>div{flex:1}.bar button{margin:0;width:auto;padding:12px 18px}
  .bar label{margin-top:0}
  .link{background:transparent;color:var(--text);border:2px solid var(--line);margin-top:6px;font-size:13px;font-weight:800;outline:2px dashed var(--line);box-shadow:none}
  .big{font-size:26px;font-weight:900;margin:6px 0}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:12px}
  .kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:800;word-break:break-word}
  h4{margin:14px 0 4px;font-size:13px;color:var(--text);font-weight:900}
  .warn{background:rgba(217,119,6,.2);color:var(--text);border:2px dashed var(--amber);padding:10px 12px;border-radius:14px;font-size:13px;font-weight:700;margin-top:12px}
  .mrow{padding:12px 0;border-bottom:1px dashed var(--line)}.mrow:last-child{border-bottom:0}
  .mhead{display:flex;justify-content:space-between;font-size:14px;font-weight:900;margin-bottom:6px}
  .mhead span{font-size:12px;color:var(--muted);font-weight:700}
  .bar2{display:flex;height:14px;border-radius:8px;overflow:hidden;background:rgba(128,128,128,.25);border:1px solid var(--line)}
  .bar2 i{display:block;height:100%}
  .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
  .leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .hcard{padding:12px 0;border-bottom:1px dashed var(--line)}.hcard:last-child{border-bottom:0}
  .htop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:900}
  .chip{font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;white-space:nowrap;border:1.5px dashed currentColor}
  .c-g{background:rgba(22,163,74,.18);color:var(--green)}.c-a{background:rgba(217,119,6,.2);color:var(--amber)}.c-r{background:rgba(220,38,38,.18);color:var(--red)}
  .hmeta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  .hrs{font-size:13px;margin-top:4px}
  .ext{display:block;text-align:center;text-decoration:none;margin-top:12px;padding:11px;border:2px solid var(--line);border-radius:14px;color:var(--text);font-weight:800;font-size:13px;outline:2px dashed var(--line);outline-offset:-6px}
  .loading{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}

  /* ===== full felt-denim theme layer ===== */
  :root{--stars:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='%23f2b632'><path d='M40 30l3 9 9 3-9 3-3 9-3-9-9-3 9-3z'/><path d='M190 150l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z'/></g><g fill='%234fc3e8'><circle cx='120' cy='60' r='2.5'/><circle cx='30' cy='170' r='2'/><circle cx='210' cy='40' r='2'/></g><g fill='%23e04456'><circle cx='90' cy='200' r='2.5'/><circle cx='160' cy='110' r='2'/></g></svg>")}
  body{background:var(--stars),var(--noise),var(--bg);background-attachment:fixed;padding:22px 16px max(28px,env(safe-area-inset-bottom))}
  body::before{content:"";position:fixed;inset:4px;border:7px solid transparent;border-radius:28px;background:var(--weave) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) exclude,linear-gradient(#000 0 0) padding-box;mask-composite:exclude;pointer-events:none;z-index:5}
  body::after{content:"";position:fixed;inset:13px;border:2px dashed var(--gold);border-radius:20px;pointer-events:none;z-index:5;opacity:.85}
  .wrap{position:relative;z-index:1}
  .badge{display:block;margin:0 auto 10px;width:74px;height:74px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  #loginCard{margin-top:6vh;padding:22px 18px}
  #loginCard .note{margin-top:14px}
  .card{padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <header><svg class="badge" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="#c8283d"/><circle cx="40" cy="40" r="36" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="2"/><circle cx="40" cy="40" r="29" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 4"/><path d="M8 52c20-30 44-34 64-22" fill="none" stroke="#f2b632" stroke-width="2.5" stroke-linecap="round"/><text x="40" y="47" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="21" fill="#fff">RFL</text></svg><h1>SRIH</h1><p>PRAN-RFL HRIS Viewer</p></header>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <label>🪪 HRIS User ID</label>
    <input id="uid" placeholder="e.g. S227230" autocomplete="username" autocapitalize="characters">
    <label>🔑 HRIS Password</label>
    <input id="pwd" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go">Login</button>
    <div class="err" id="loginErr"></div>
    <p class="note">🔒 ID/Password kothao save hoy na. Shudhu HRIS-e dhukte pathano hoy. Ei site shudhu dekhay, kono apply/save kore na.</p>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="attendance">📅 Attendance</button>
      <button class="tab" data-t="balance">🏖️ Leave</button>
      <button class="tab" data-t="payslip">💰 Salary</button>
      <button class="tab" data-t="purchase">🍽️ Canteen</button>
      <button class="tab" data-t="trend">📈 Trend</button>
      <button class="tab" data-t="iom">🕘 IOM</button>
    </div>
    <div class="card" id="barCard">
      <div class="bar">
        <div><label>Month</label><select id="month"></select></div>
        <div><label>Year</label><input id="year" type="number"></div>
        <button id="load">Show</button>
      </div>
    </div>
    <div class="err" id="err"></div>
    <div id="out"></div>
    <button class="link" id="logout">Logout</button>
  </div>
</div>

<script>
  // API ekii site-er moddhe, tai URL bodlate hobe na
  const API = "/api/hris";
  const $ = id => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const now = new Date();
  let cred = null;       // shudhu memory-te, page close korle chole jay
  let tab = "attendance";
  let cache = {};

  $("month").innerHTML = MONTHS.map((m,i)=>`<option value="${i+1}" ${i===now.getMonth()?"selected":""}>${m}</option>`).join("");
  $("year").value = now.getFullYear();
  try { $("uid").value = localStorage.getItem("srih_uid") || ""; } catch(e){}

  async function call(page, extra = {}) {
    const res = await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ id: cred.id, pass: cred.pass, page, month: $("month").value, year: $("year").value, ...extra }) });
    let data; try { data = await res.json(); } catch { throw new Error("Server theke bhul uttor (" + res.status + ")"); }
    if (!res.ok || data.error) throw new Error(data.error || "Server error");
    return data;
  }

  function showErr(el, msg){ el.textContent = msg; el.style.display = msg ? "block" : "none"; }

  // ---- login = Attendance diye test kora ----
  $("go").onclick = async () => {
    const id = $("uid").value.trim(), pass = $("pwd").value;
    if (!id || !pass) return showErr($("loginErr"), "ID ar Password dao");
    showErr($("loginErr"), ""); $("go").disabled = true; $("go").textContent = "Loading...";
    cred = { id, pass };
    try {
      const d = await call("attendance");
      try { localStorage.setItem("srih_uid", id); } catch(e){}
      $("pwd").value = "";
      $("loginCard").style.display = "none"; $("app").style.display = "block";
      cache = {}; cache["attendance|" + key()] = d;
      switchTab("attendance", true);
    } catch (e) {
      cred = null;
      showErr($("loginErr"), e.message === "Failed to fetch" ? "Server-e connect hocche na. Internet check koro." : e.message);
    }
    $("go").disabled = false; $("go").textContent = "Login";
  };
  $("pwd").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

  $("logout").onclick = () => { cred = null; cache = {}; $("out").innerHTML = ""; $("app").style.display = "none"; $("loginCard").style.display = "block"; };

  const key = () => $("month").value + "-" + $("year").value;

  document.querySelectorAll(".tab").forEach(b => b.onclick = () => switchTab(b.dataset.t));
  $("load").onclick = () => { delete cache[tab + "|" + key()]; switchTab(tab, true); };

  async function switchTab(t, force) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    $("barCard").style.display = (t === "balance" || t === "trend" || t === "iom") ? "none" : "block";
    showErr($("err"), "");
    const ck = t + "|" + key();
    if (cache[ck]) return render(t, cache[ck]);
    $("out").innerHTML = '<div class="loading">Loading...</div>';
    try {
      const d = await call(t);
      cache[ck] = d;
      if (tab === t) render(t, d);
    } catch (e) {
      if (tab === t) { $("out").innerHTML = ""; showErr($("err"), e.message); }
    }
  }

  const stat = (l,v,c) => `<div class="stat ${c}">${l}<b>${esc(v||0)}</b></div>`;

  function render(t, d) {
    if (t === "attendance") return renderAttendance(d);
    if (t === "balance") return renderBalance(d);
    if (t === "payslip") return renderPayslip(d);
    if (t === "purchase") return renderPurchase(d);
    if (t === "trend") return renderTrend(d);
    if (t === "iom") return renderIom(d);
  }

  function renderAttendance(d) {
    const s = d.summary || {}, rows = d.rows || [];
    const body = rows.map(r => {
      const x = String(r.status||"").toLowerCase();
      const cls = x.startsWith("present") ? "present" : x.startsWith("absent") ? "absent" : (x.includes("off")||x.includes("holiday")) ? "off" : "other";
      return `<tr class="${cls}"><td>${esc(r.date)}</td><td>${esc((r.day||"").slice(0,3))}</td><td>${esc(r.inTime||"-")}</td><td>${esc(r.outTime||"-")}</td><td class="st">${esc(r.status)}</td></tr>`;
    }).join("");
    $("out").innerHTML = `<div class="card">
      <div class="name">${esc(s.name||"My Attendance")}</div>
      <div class="sub">Staff ID: ${esc(s.staffId||"-")} • Total Days: ${esc(s.totalDays||"-")}${s.payableDays?" • Payable: "+esc(s.payableDays):""}${s.lateMinutes?" • Late Min: "+esc(s.lateMinutes):""}</div>
      <div class="grid">${stat("Present",s.present,"g")+stat("Absent",Math.max(0,(+s.absent||0)-(+d.futureAbsent||0)),"r")+stat("Late",s.late,"a")+stat("Leave (Pay)",s.leaveWithPay,"b")+stat("Leave (No Pay)",s.leaveWithoutPay,"p")+stat("Holiday",s.holiday,"s")}</div>
      ${(+d.futureAbsent>0)?`<div class="sub" style="margin-top:8px">ℹ️ HRIS-e Absent ${esc(s.absent)}, tar moddhe ${esc(d.futureAbsent)} din ekhono ashe ni (ajker por-er din), tai upore baad dewa hoyeche.</div>`:""}
      ${(+s.late>0)?`<div class="warn">⏰ Ei mash-e ${esc(s.late)} bar late${s.lateMinutes?" (mot "+esc(s.lateMinutes)+" minute)":""}</div>`:""}
      <div class="tw"><table><thead><tr><th>Date</th><th>Day</th><th>In</th><th>Out</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  }

  function chipCls(st) { st = String(st||"").toLowerCase(); return /approv/.test(st) ? "c-g" : /reject|cancel|den|declin/.test(st) ? "c-r" : "c-a"; }
  function histCards(hh) {
    const H = (hh && hh.headers) || [], R = (hh && hh.rows) || [];
    if (!R.length) return '<p class="sub" style="margin-top:10px">Kono history pai ni.</p>';
    const idx = re => H.findIndex(x => re.test(x));
    const iF = idx(/from/i), iT = idx(/^to/i), iS = idx(/status/i), iR = idx(/reason/i);
    return R.map(r => {
      const from = r[iF >= 0 ? iF : 0], to = r[iT >= 0 ? iT : 1];
      const st = iS >= 0 ? r[iS] : "";
      const skip = new Set([iF >= 0 ? iF : 0, iT >= 0 ? iT : 1, iS, iR]);
      const meta = r.map((v, i) => skip.has(i) || !v ? null : (H[i] ? H[i] + ": " : "") + v).filter(Boolean).join(" • ");
      return `<div class="hcard"><div class="htop"><span>${esc(from)}${to && to !== from ? " → " + esc(to) : ""}</span>${st ? `<span class="chip ${chipCls(st)}">${esc(st)}</span>` : ""}</div>${iR >= 0 && r[iR] ? `<div class="hrs">${esc(r[iR])}</div>` : ""}<div class="hmeta">${esc(meta)}</div></div>`;
    }).join("");
  }
  const HRIS_LEAVE = "http://hris.prangroup.com:8686/Pages/Portal/QLvApplication.aspx";
  const HRIS_IOM = "http://hris.prangroup.com:8686/Pages/Portal/QPersonalIOM.aspx";

  function renderBalance(d) {
    $("out").innerHTML = `<div class="card">
      <div class="name">Leave Balance</div>
      <div class="kv"><span>Balance</span><span>${esc(d.balance||"-")}</span></div>
      <div class="kv"><span>Entitled</span><span>${esc(d.entitled||"-")}</span></div>
      <div class="kv"><span>First Approver</span><span>${esc(d.firstApprover||"-")}</span></div>
      <div class="kv"><span>Final Approver</span><span>${esc(d.finalApprover||"-")}</span></div>
      <a class="ext" href="${HRIS_LEAVE}" target="_blank" rel="noopener">HRIS-e Leave apply koro ↗</a></div>
      <div class="card"><div class="name">Leave history</div>${histCards(d.history)}</div>`;
  }

  function renderIom(d) {
    $("out").innerHTML = `<div class="card"><div class="name">IOM history</div>${histCards(d)}
      <a class="ext" href="${HRIS_IOM}" target="_blank" rel="noopener">HRIS-e IOM apply koro ↗</a></div>`;
  }

  function renderPayslip(d) {
    const rows = a => a.map(r => `<div class="kv"><span>${esc(r.name)}</span><span>${esc(r.amount)}</span></div>`).join("") || '<div class="kv"><span>-</span><span></span></div>';
    $("out").innerHTML = `<div class="card">
      <div class="name">${esc(d.name||"Salary")}</div>
      <div class="sub">${esc(d.title||"")}${d.department?" • "+esc(d.department):""}${d.attendance?" • Attendance: "+esc(d.attendance):""}</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">${stat("Allowance",d.totalAllowance,"g")+stat("Deduction",d.totalDeduction,"r")+stat("Net",d.net,"b")}</div>
      <h4>Allowance</h4>${rows(d.allowance||[])}
      <h4>Deduction</h4>${rows(d.deduction||[])}</div>`;
  }


  function renderTrend(d) {
    const ms = d.months || [];
    const rows = ms.map(m => {
      const ab = Math.max(0, m.absent - (m.future || 0));
      const tot = (m.present + ab + m.leave + m.holiday) || 1;
      const w = n => (n * 100 / tot).toFixed(1) + "%";
      return `<div class="mrow"><div class="mhead">${esc(m.label)}<span>${m.ok ? "Late: " + m.late + (m.lateMinutes ? " (" + m.lateMinutes + " min)" : "") : "data nai"}</span></div>
        <div class="bar2"><i style="width:${w(m.present)};background:var(--green)"></i><i style="width:${w(m.leave)};background:var(--blue)"></i><i style="width:${w(m.holiday)};background:#94a3b8"></i><i style="width:${w(ab)};background:var(--red)"></i></div>
        <div class="leg"><span><b style="background:var(--green)"></b>Present ${m.present}</span><span><b style="background:var(--red)"></b>Absent ${ab}</span><span><b style="background:var(--blue)"></b>Leave ${m.leave}</span><span><b style="background:#94a3b8"></b>Holiday ${m.holiday}</span></div></div>`;
    }).join("");
    $("out").innerHTML = `<div class="card"><div class="name">Last 4 mash</div><div class="sub">Present, Absent, Leave ar Holiday-r tulona</div>${rows}</div>`;
  }

  function renderPurchase(d) {
    const items = d.items || [];
    const opts = (d.subheads||[]).map(s => `<option value="${esc(s.value)}" ${s.value===d.subhead?"selected":""}>${esc(s.name)}</option>`).join("");
    const body = items.map(r => `<tr><td>${esc(r.date.slice(0,10))}<br><span style="color:var(--muted)">${esc(r.date.slice(11,16))}</span></td><td style="white-space:normal">${esc(r.item)}</td><td class="n">${esc(r.qty)}</td><td class="n">${esc(r.amount)}</td></tr>`).join("");
    $("out").innerHTML = `<div class="card">
      <div class="name">Canteen / Purchase</div>
      <div class="big">৳ ${esc(d.total)}</div>
      <div class="sub">${items.length} ti item</div>
      ${opts ? `<label>Sub Head</label><select id="sh">${opts}</select>` : ""}
      <div class="tw"><table><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${body || '<tr><td colspan="4" style="text-align:center;padding:20px">Kono data nai</td></tr>'}</tbody></table></div></div>`;
    const sh = $("sh");
    if (sh) sh.onchange = async () => {
      $("out").innerHTML = '<div class="loading">Loading...</div>';
      try { const nd = await call("purchase", { subhead: sh.value }); cache["purchase|" + key()] = nd; renderPurchase(nd); }
      catch (e) { showErr($("err"), e.message); }
    };
  }
</script>
</body>
</html>
