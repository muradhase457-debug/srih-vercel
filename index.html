<script>
  // The API lives on the same site, so no URL change is needed
  const API = "/api/hris";
  const $ = id => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const now = new Date();
  let cred = null;       // kept in memory only; cleared when the page is closed
  let tab = "attendance";
  let cache = {};

  $("month").innerHTML = MONTHS.map((m,i)=>`<option value="${i+1}" ${i===now.getMonth()?"selected":""}>${m}</option>`).join("");
  $("year").value = now.getFullYear();
  try { $("uid").value = localStorage.getItem("srih_uid") || ""; } catch(e){}

  async function call(page, extra = {}) {
    let res, data;
    for (let t = 0; t < 2; t++) {
      res = await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ id: cred.id, pass: cred.pass, sess: cred.sess, page, month: $("month").value, year: $("year").value, ...extra }) });
      try { data = await res.json(); } catch { throw new Error("Invalid response from server (" + res.status + ")"); }
      // HRIS only timed out (flaky route): try once more automatically
      if (!(res.status === 502 && /timeout|reach kora/i.test((data && data.error) || "")) || t === 1) break;
      const g = $("go"); if (g && g.disabled) g.textContent = "Retrying...";
      await new Promise(r => setTimeout(r, 1200));
    }
    if (!res.ok || data.error) throw new Error(data.error || "Server error");
    if (data.sess && cred) { cred.sess = data.sess; }   // HRIS session kept in memory only, so the next tabs open fast
    delete data.sess;
    return data;
  }

  function showErr(el, msg){ el.textContent = msg; el.style.display = msg ? "block" : "none"; }

  // ---- login = test with the Attendance request ----
  $("go").onclick = async () => {
    const id = $("uid").value.trim(), pass = $("pwd").value;
    if (!id || !pass) return showErr($("loginErr"), "Enter your ID and password");
    showErr($("loginErr"), ""); $("go").disabled = true; $("go").textContent = "Loading...";
    cred = { id, pass };
    try {
      const d = await call("attendance");
      try { localStorage.setItem("srih_uid", id); } catch(e){}
      $("pwd").value = "";
      $("loginCard").style.display = "none"; $("app").style.display = "block"; setMini(1);
      cache = {}; cache["attendance|" + key()] = d;
      switchTab("attendance", "first");
      call("photo").then(p => {
        if (cred && p && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(p.photo || "")) {
          cred.photo = p.photo;
          document.querySelectorAll(".av").forEach(a => { a.style.background = "url(" + p.photo + ") center/cover no-repeat, var(--hero) -94px -75px/244px no-repeat"; });
        }
      }).catch(() => {});
    } catch (e) {
      cred = null;
      showErr($("loginErr"), e.message === "Failed to fetch" ? "Can't reach the server. Please check your internet connection." : e.message);
    }
    $("go").disabled = false; $("go").textContent = "Login";
  };
  $("pwd").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

  $("logout").onclick = () => { cred = null; cache = {}; $("out").innerHTML = ""; $("app").style.display = "none"; $("loginCard").style.display = "block"; setMini(0); };

  const key = () => $("month").value + "-" + $("year").value;

  document.querySelectorAll(".tab").forEach(b => b.onclick = () => switchTab(b.dataset.t));

  function mins(t){const m=/(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(t||"");if(!m)return null;let h=+m[1];if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return h*60+ +m[2]}
  function stC(x){x=String(x||"").toLowerCase();return /absent/.test(x)?"--red":/late/.test(x)?"--amber":/^present/.test(x)?"--green":/leave/.test(x)?"--blue":/off|holiday/.test(x)?"--teal":/today/.test(x)?"--gold":"--muted"}
  function countUp(sel){document.querySelectorAll(sel).forEach(b=>{const t=+b.textContent;if(isNaN(t)||!t)return;const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/900);b.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}

    const seg=[[P-L,"--green","On-time"],[L,"--amber","Late"],[lv,"--blue","Leave"],[ab,"--red","Absent"],[H,"--teal","Holiday"]].filter(x=>x[0]>0),tot=seg.reduce((a,x)=>a+x[0],0)||1,C=2*Math.PI*54,g=seg.length>1?9:0;

    TABS.addEventListener("scroll", upd, { passive: true });
    window.addEventListener("resize", upd);
    if (window.ResizeObserver) new ResizeObserver(upd).observe(TABS);
    upd();
    TABS.addEventListener("wheel", e => {
      if (TABS.scrollWidth > TABS.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { TABS.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive: false });
    let down = false, moved = false, sx = 0, sl = 0;
    TABS.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button !== 0) return; down = true; moved = false; sx = e.clientX; sl = TABS.scrollLeft; });
    window.addEventListener("pointermove", e => {
      if (!down) return;
      const dx = e.clientX - sx;
      if (!moved && Math.abs(dx) > 5) { moved = true; TABS.classList.add("dragging"); }
      if (moved) TABS.scrollLeft = sl - dx;
    });
    window.addEventListener("pointerup", () => { if (down && moved) setTimeout(() => TABS.classList.remove("dragging"), 0); down = false; });
    TABS.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  })();
</script>

<script>
// ===== Rube-Goldberg login machine (decor only; the real login code is untouched) =====
(function(){
  const q = id => document.getElementById(id);
  const svg = q("rg"); if (!svg) return;
  const R = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
  const mod = (x, m) => ((x % m) + m) % m;
  const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
  const clamp01 = u => Math.max(0, Math.min(1, u));

  // gears: teeth path + exact meshing phase
  function gearPath(r, n, d) {
    const N = n * 4; let p = "";
    for (let i = 0; i < N; i++) {
      const a = i * 2 * Math.PI / N, rr = (i % 4 === 1 || i % 4 === 2) ? r + d : r;
      p += (i ? "L" : "M") + (rr * Math.cos(a)).toFixed(1) + " " + (rr * Math.sin(a)).toFixed(1);
    }
    return p + "Z";
  }
  q("g1p").setAttribute("d", gearPath(24, 14, 3));
  q("g2p").setAttribute("d", gearPath(14, 8, 3));
  const dB = 2 * Math.PI / 56, dS = 2 * Math.PI / 32, phi = Math.atan2(12, -37);
  const f0 = mod(phi - 1.5 * dB, 4 * dB) / (4 * dB);
  const B0 = (phi + Math.PI - 1.5 * dS - (0.5 - f0) * 4 * dS) * 180 / Math.PI;

  // ramp geometry (ball center sits on the ramp surface)
  const A = [88, 70], B = [218, 138], N = [0.463, -0.886], BR = 6;
  const onRamp = t => [A[0] + t * (B[0] - A[0]) + N[0] * BR, A[1] + t * (B[1] - A[1]) + N[1] * BR];
  const RAMP_LEN = Math.hypot(B[0] - A[0], B[1] - A[1]);
  const T0 = 0.07;

  const S = { lift: 0, liftT: 0, need: 0, needT: 0, a: 0, spin: 0, spinT: 0,
    phase: "idle", tr: 0, result: null, bt: 0, pin: 0, dom: 0, rod: 0, lamp: "off",
    bx: 0, by: 0, br: 0, clock: 0 };
  const placeBall = () => { const p = onRamp(T0); S.bx = p[0]; S.by = p[1]; S.br = 0; };
  placeBall();

  const uid = q("uid"), pwd = q("pwd");
  const syncInputs = () => { S.liftT = clamp01(uid.value.length / 10); S.needT = clamp01(pwd.value.length / 12); };
  syncInputs(); S.lift = S.liftT; S.need = S.needT;

  function reset() {
    S.phase = "idle"; S.result = null; S.tr = 0; S.pin = 0; S.dom = 0; S.rod = 0; S.lamp = "off"; S.spinT = 0;
    placeBall(); syncInputs(); setLamp("off"); q("lamp").style.opacity = 1; kick();
  }

  function setLamp(kind) {
    const lamp = q("lamp"), lt = q("lt");
    S.lamp = kind;
    const fill = { off: "none", wait: "var(--gold)", ok: "var(--teal)", bad: "var(--r,#e5533d)" }[kind];
    lamp.style.fill = fill;
    lamp.style.filter = kind === "off" ? "none" : "drop-shadow(0 0 7px " + (kind === "bad" ? "var(--r,#e5533d)" : kind === "ok" ? "var(--teal)" : "var(--gold)") + ")";
    lt.textContent = kind === "ok" ? "✓" : kind === "bad" ? "✕" : "";
  }

  function step(dt) {
    S.clock += dt;
    const k = R ? 1 : Math.min(1, dt * 8);
    S.lift += (S.liftT - S.lift) * k;
    S.need += (S.needT - S.need) * k;
    S.spin += (S.spinT - S.spin) * Math.min(1, dt * 3);
    S.a += S.spin * dt;

    if (S.phase === "run") {
      S.tr += dt; const t = S.tr;
      S.spinT = 420;
      S.pin = ease(t / 0.2);
      if (t >= 0.2 && t < 1.25) {
        const u = (t - 0.2) / 1.05, tt = T0 + (1 - T0) * u * u, p = onRamp(tt);
        S.bx = p[0]; S.by = p[1]; S.br = ((tt - T0) * RAMP_LEN / BR) * 57.3;
      } else if (t >= 1.25) {
        const e = onRamp(1), v = clamp01((t - 1.25) / 0.25);
        S.bx = e[0] + (225 - e[0]) * v; S.by = e[1] + (144 - e[1]) * v * v; S.br += 6;
      }
      S.dom = t > 1.5 ? 82 * Math.pow(clamp01((t - 1.5) / 0.4), 2) : 0;
      S.rod = t > 1.9 ? 14 * ease((t - 1.9) / 0.35) : 0;
      if (t >= 2.25) { S.phase = "wait"; S.spinT = 110; setLamp("wait"); }
    }
    if (S.phase === "wait") {
      q("lamp").style.opacity = (0.65 + 0.35 * Math.sin(S.clock * 6)).toFixed(2);
      if (S.result === "ok") { S.phase = "done"; S.spinT = 0; q("lamp").style.opacity = 1; setLamp("ok"); }
      if (S.result === "bad") { S.phase = "bad"; S.bt = 0; S.spinT = 0; q("lamp").style.opacity = 1; setLamp("bad"); q("rgbox").classList.add("rgshake"); setTimeout(() => q("rgbox").classList.remove("rgshake"), 450); }
    }
    if (S.phase === "bad") { S.bt += dt; if (S.bt > 1.3) reset(); }
  }

  function draw() {
    const d = S.lift * 40;
    q("w1").setAttribute("transform", "translate(29 " + (100 - d).toFixed(1) + ")");
    q("rl").setAttribute("y2", (100 - d).toFixed(1));
    q("w2").setAttribute("transform", "translate(51 " + (56 + d).toFixed(1) + ")");
    q("rr").setAttribute("y2", (56 + d).toFixed(1));
    q("pul").setAttribute("transform", "translate(40 28) rotate(" + (S.lift * 360).toFixed(1) + ")");
    q("nd").setAttribute("transform", "translate(40 142) rotate(" + (-80 + S.need * 160).toFixed(1) + ")");
    q("g1").setAttribute("transform", "translate(284 40) rotate(" + S.a.toFixed(2) + ")");
    q("g2").setAttribute("transform", "translate(247 52) rotate(" + (B0 - 1.75 * S.a).toFixed(2) + ")");
    q("belt").style.strokeDashoffset = (-S.a * 0.12).toFixed(1);
    q("pin").setAttribute("transform", "translate(0 " + (-S.pin * 20).toFixed(1) + ")");
    q("pin").style.opacity = (1 - 0.6 * S.pin).toFixed(2);
    q("ball").setAttribute("transform", "translate(" + S.bx.toFixed(1) + " " + S.by.toFixed(1) + ") rotate(" + S.br.toFixed(1) + ")");
    q("dom").setAttribute("transform", "rotate(" + S.dom.toFixed(1) + " 236 150)");
    q("rod").setAttribute("transform", "translate(" + S.rod.toFixed(1) + " 0)");
  }

  let raf = 0, last = 0;
  function busy() {
    return S.phase === "run" || S.phase === "wait" || S.phase === "bad" || Math.abs(S.lift - S.liftT) > 0.002 ||
      Math.abs(S.need - S.needT) > 0.002 || Math.abs(S.spin) > 1.5 || Math.abs(S.spinT) > 1;
  }
  function loop(ts) {
    raf = 0; const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
    step(dt); draw();
    if (busy()) raf = requestAnimationFrame(loop); else last = 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  // typing drives the machine
  uid.addEventListener("input", () => { syncInputs(); S.spin += 240; kick(); });
  pwd.addEventListener("input", () => { syncInputs(); S.spin += 240; kick(); });
  const burst = () => { S.spin += 520; kick(); };
  q("g1").addEventListener("click", burst); q("g2").addEventListener("click", burst);

  // Login button starts the chain (runs next to the real login request, never delays it)
  q("go").addEventListener("click", () => {
    if (!uid.value.trim() || !pwd.value) { q("rgbox").classList.add("rgshake"); setTimeout(() => q("rgbox").classList.remove("rgshake"), 450); return; }
    if (S.phase !== "idle") return;
    S.result = null; S.tr = 0; S.phase = "run"; setLamp("off"); q("lamp").style.opacity = 1;
    if (R) { S.phase = "wait"; setLamp("wait"); }
    kick();
  });

  // result detection: error shown => jam, card hidden => success, card back => reset
  new MutationObserver(() => {
    const e = q("loginErr");
    if (e.style.display === "block" && e.textContent && S.phase !== "idle") { S.result = "bad"; kick(); }
  }).observe(q("loginErr"), { attributes: true, childList: true, characterData: true, subtree: true });
  new MutationObserver(() => {
    if (q("loginCard").style.display === "none") { if (S.phase !== "idle") { S.result = "ok"; kick(); } }
    else if (S.phase === "done" || S.phase === "wait") reset();
  }).observe(q("loginCard"), { attributes: true, attributeFilter: ["style"] });

  setLamp("off"); draw();
})();
</script>
<script>
// Liquid Login button: fills while logging in, empties again on error / logout (real login code untouched)
(function(){
  const q = id => document.getElementById(id), go = q("go"); if (!go) return;
  const jig = () => { go.classList.remove("jig"); void go.offsetWidth; go.classList.add("jig"); };
  go.addEventListener("click", () => { if (q("uid").value.trim() && q("pwd").value) { go.classList.add("on"); jig(); } });
  const lo = q("logout");
  if (lo) lo.addEventListener("click", () => { lo.classList.add("on", "jig"); setTimeout(() => lo.classList.remove("on", "jig"), 700); });
  const ld = q("load");
  if (ld) ld.addEventListener("click", () => { ld.classList.add("on", "jig"); setTimeout(() => ld.classList.remove("on", "jig"), 1100); });
  new MutationObserver(() => { const e = q("loginErr"); if (e.style.display === "block" && e.textContent) { go.classList.remove("on"); jig(); } })
    .observe(q("loginErr"), { attributes: true, childList: true, characterData: true, subtree: true });
  new MutationObserver(() => { if (q("loginCard").style.display !== "none") go.classList.remove("on"); })
    .observe(q("loginCard"), { attributes: true, attributeFilter: ["style"] });
})();
</script>
<script>
// Running clock inside the picture (shows the phone's time, second hand ticks)
(function(){
  const hh=document.getElementById("ckh"),mh=document.getElementById("ckm"),sh=document.getElementById("cks"); if(!hh) return;
  let sAcc=null,last=-1;
  function tick(){
    const d=new Date(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours()%12;
    if(sAcc===null) sAcc=s*6; else if(s!==last) sAcc+=((s-last+60)%60)*6;
    last=s;
    sh.style.rotate=(sAcc+180)+"deg";
    mh.style.rotate=(m*6+s*.1+180)+"deg";
    hh.style.rotate=(h*30+m*.5+180)+"deg";
  }
  tick(); setInterval(tick,1000);
})();
</script>
