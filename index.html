*{box-sizing:border-box}[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;left:50%;top:36%;width:130vmax;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;opacity:.25;background:repeating-conic-gradient(var(--teal) 0 .4deg,transparent .4deg 5deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 66.3%,#000 68%,transparent 68.3%);mask:radial-gradient(circle,transparent 66%,#000 66.3%,#000 68%,transparent 68.3%);animation:sp 240s linear infinite}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 25%,transparent 50%,var(--sh))}
@keyframes sp{to{rotate:360deg}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:26px 18px 90px}
.th{position:fixed;z-index:9;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
.stage{--w:min(86vw,380px);position:relative;width:var(--w);aspect-ratio:1;margin:8px auto 0;perspective:1100px;animation:fl 6s ease-in-out infinite;transition:width .8s cubic-bezier(.3,1.2,.4,1)}
.mini .stage{--w:128px;margin-top:0}
@keyframes fl{50%{translate:0 -10px}}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;animation:in 1s cubic-bezier(.2,1.2,.3,1) backwards}
@keyframes in{from{opacity:0;transform:rotateX(40deg) translateY(50px) scale(.7)}}
.art{position:absolute;inset:0;border-radius:7%;overflow:hidden;background:var(--hero) center/cover;box-shadow:0 0 0 2px var(--gold),0 30px 46px var(--sh)}
.spec,.shn{position:absolute;inset:0;mix-blend-mode:soft-light}
.spec{background:radial-gradient(circle at var(--mx,30%) var(--my,15%),rgba(255,255,255,.8),transparent 50%)}
.shn{background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%) -160% 0/250% 100% no-repeat;animation:swp 5s ease-in-out infinite}
@keyframes swp{0%,30%{background-position:-160% 0}80%,100%{background-position:160% 0}}
.lyr{position:absolute;inset:0;transform:translateZ(var(--z));pointer-events:none;filter:drop-shadow(0 14px 12px rgba(0,0,0,.4))}
.lyr div{position:absolute;inset:0;background:var(--hero) center/cover}
.c1{clip-path:circle(16.6% at 51.2% 43.6%)}.c2{clip-path:inset(66.5% 14% 13.5% 14% round 1.5%)}
.halo{position:absolute;left:51.2%;top:43.6%;width:48%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(59,123,255,.65),rgba(71,202,188,.3) 55%,transparent 70%);filter:blur(20px);transform:translateZ(10px);animation:pl 2.6s ease-in-out infinite alternate}
@keyframes pl{from{opacity:.4;scale:.9}to{opacity:1;scale:1.15}}
.ring{position:absolute;left:51.2%;top:43.6%;width:39%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px dashed #e6cb80;box-shadow:0 0 14px rgba(230,203,128,.7);transform:translateZ(84px);animation:sp 14s linear infinite}
.orbit{position:absolute;left:51.2%;top:43.6%;width:0;height:0;transform-style:preserve-3d;transform:translateZ(90px) rotateX(72deg)}
.orbit i{position:absolute;left:0;top:0;width:calc(var(--w)*.026);height:calc(var(--w)*.026);margin:calc(var(--w)*-.013);border-radius:50%;background:#fff3c4;box-shadow:0 0 10px 3px #e6cb80;animation:ob var(--t) linear infinite;animation-delay:var(--o)}
@keyframes ob{from{transform:rotate(0) translateX(var(--r)) rotate(0)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}
.gs{position:absolute;left:14%;right:14%;bottom:-16px;height:24px;border-radius:50%;background:radial-gradient(var(--sh),transparent 70%);animation:gs 6s ease-in-out infinite}
@keyframes gs{50%{scale:.82;opacity:.6}}
.mini .orbit,.mini .ring,.mini .gs,.mini .halo{display:none}
.brand{display:block;width:max-content;margin:24px auto 4px;padding:7px 20px;border-radius:99px;font-weight:800;font-size:12.5px;letter-spacing:.6px;background:var(--card);backdrop-filter:blur(8px);border:1.5px solid var(--gold);box-shadow:0 6px 12px var(--sh)}
.mini .brand{margin-top:14px}
.tag{text-align:center;color:var(--mut);font-size:13px;font-weight:700;margin:6px 0 18px}
.card{position:relative;margin-bottom:18px;padding:18px;border-radius:24px;background:var(--card);backdrop-filter:blur(12px);border:1.5px solid color-mix(in srgb,var(--gold) 60%,transparent);box-shadow:0 18px 30px -10px var(--sh),inset 0 1px 0 rgba(255,255,255,.4)}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--in);color:var(--ink);font:inherit;font-size:15px;font-weight:600}
input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{position:relative;overflow:hidden;width:100%;margin-top:16px;padding:14px;border:1.5px solid var(--gold);border-radius:16px;font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#36a89c,#1d6f6f 60%,#165457);box-shadow:0 5px 0 #0f3d40,0 12px 18px var(--sh),inset 0 1px 2px rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(0,0,0,.35)}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);translate:-130% 0;animation:sw 4s ease-in-out infinite}
@keyframes sw{0%,55%{translate:-130% 0}100%{translate:130% 0}}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #0f3d40}
button.link{background:var(--card);color:var(--ink);text-shadow:none;box-shadow:0 5px 10px var(--sh)}
.note{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.55;margin:14px 0 0}
.rise{animation:rs .7s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--d,0s)}
@keyframes rs{from{opacity:0;transform:translateY(30px) scale(.96)}}
.me{display:flex;gap:14px;align-items:center}
.av{flex:none;width:62px;height:62px;border-radius:50%;background:var(--hero) -94px -75px/244px no-repeat;border:2px solid var(--gold);box-shadow:0 0 0 4px var(--card),0 0 18px rgba(59,123,255,.6)}
.nm{font-size:20px;font-weight:800}.sb{font-size:12px;color:var(--mut);margin-top:2px}
.tabs{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.tab.on{color:#fff;border-color:var(--gold);background:linear-gradient(180deg,#36a89c,#1d6f6f 60%,#165457);box-shadow:0 4px 0 #0f3d40}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar button{grid-column:1/-1;margin-top:4px}
.sum{display:flex;align-items:center;gap:16px}
.rg{flex:none;width:140px;height:140px;position:relative}.rg svg{width:100%;height:100%}
.rg circle{transition:stroke-dasharray 1.3s cubic-bezier(.2,.9,.2,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rc b{font-size:34px;line-height:1}.rc span{font-size:10.5px;font-weight:800;color:var(--mut)}
.lg{font-size:12.5px;font-weight:800;line-height:2}.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{padding:13px 4px;border-radius:18px;text-align:center;font-size:11px;font-weight:800;color:var(--c);background:linear-gradient(color-mix(in srgb,var(--c) 24%,transparent),color-mix(in srgb,var(--c) 8%,transparent)),var(--card);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 8px 12px var(--sh);animation:pop .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
.stat b{display:block;font-size:26px;margin-top:2px;color:var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(14px)}}
.warn{margin-top:16px;padding:11px 14px;border-radius:16px;font-size:13px;font-weight:800;border:1.5px solid var(--a);background:color-mix(in srgb,var(--a) 16%,transparent)}
h3{margin:0 0 14px;font-size:15px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;border-left:3px dashed var(--gold)}
.row{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:11px 12px;border-radius:18px;background:rgba(127,150,160,.14);border:1.5px solid transparent;animation:rs .6s ease both;animation-delay:var(--d)}
.row::before{content:"";position:absolute;left:-24px;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--card),0 0 10px var(--c)}
.row.today{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}.row.today::before{animation:pl 1s ease-in-out infinite alternate}
.dt{flex:none;width:46px;text-align:center;line-height:1}.dt b{font-size:24px}.dt span{display:block;font-size:10px;font-weight:800;color:var(--mut);margin-top:3px}
.mid{flex:1;min-width:0;font-size:12.5px;font-weight:800}.mid small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.hb{height:7px;border-radius:9px;background:rgba(127,150,160,.3);margin-top:7px;overflow:hidden}.hb u{display:block;height:100%;width:0;border-radius:9px;background:var(--c);transition:width 1.2s ease .3s}
.pill{flex:none;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800;color:var(--pt);background:var(--c)}
.pv{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;gap:8px}
.pv button{width:auto;margin:0;padding:9px 16px;font-size:12px;border-radius:99px}
.ph{text-align:center;padding:30px 10px;font-weight:800}.ph div{font-size:46px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><style>

.stat.g{--c:var(--green)}.stat.r{--c:var(--red)}.stat.a{--c:var(--amber)}.stat.b{--c:var(--blue)}.stat.p{--c:var(--purple)}.stat.s{--c:var(--teal)}
.name{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:2px}

.loading{text-align:center;padding:30px;font-weight:800;color:var(--muted)}.loading::before{content:"";display:block;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp .9s linear infinite}
.ext{display:block;margin-top:14px;text-align:center;padding:12px;border-radius:14px;font-weight:800;color:var(--teal);border:1.5px dashed var(--gold);text-decoration:none}

.hcard{padding:12px 14px;margin-top:10px;border-radius:16px;background:rgba(127,150,160,.14);border:1.5px solid var(--line)}.htop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800;font-size:13.5px}.hrs{margin-top:6px;font-size:13px}.hmeta{margin-top:6px;font-size:11.5px;color:var(--muted)}
.chip{flex:none;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;color:var(--pt)}.c-g{background:var(--green)}.c-r{background:var(--red)}.c-a{background:var(--amber)}
.mrow{margin-top:16px}.mhead{display:flex;justify-content:space-between;font-weight:800;font-size:14px}.mhead span{font-size:11.5px;color:var(--muted)}
.bar2{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:8px 0;background:rgba(127,150,160,.3)}.bar2 i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;font-weight:700}.leg b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.big{font-size:34px;font-weight:800;margin:8px 0}h4{margin:16px 0 4px;font-size:12px;letter-spacing:.6px;color:var(--teal);text-transform:uppercase}

table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:var(--card);backdrop-filter:blur(8px);text-align:left;padding:9px 6px;font-weight:800;border-bottom:1.5px solid var(--gold)}
td{padding:9px 6px;border-bottom:1px dashed var(--line)}td.n{text-align:right;font-weight:800}td.st{font-weight:800}

<body>
<div class="wrap">
  <button class="th" id="thm" aria-label="Theme">◐</button>
  <div class="stage" id="st"><div class="tilt" id="tl"><div class="art"><b class="spec"></b><b class="shn"></b></div><div class="halo"></div><div class="lyr" style="--z:34px"><div class="c2"></div></div><div class="lyr" style="--z:64px"><div class="c1"></div></div><div class="ring"></div><div class="orbit"><i style="--r:calc(var(--w)*.27);--t:8s;--o:-0s"></i><i style="--r:calc(var(--w)*.27);--t:8s;--o:-4s"></i><i style="--r:calc(var(--w)*.33);--t:12s;--o:-3s"></i><i style="--r:calc(var(--w)*.33);--t:12s;--o:-9s"></i></div></div><div class="gs"></div></div>
<span class="brand">PRAN-RFL · HRIS Viewer</span>
  <p class="tag">Tomar attendance, ek jhalak-e ✨</p>

  <!-- LOGIN -->
  <div class="card rise" id="loginCard">
    <label>🪪 HRIS User ID</label>
    <input id="uid" placeholder="e.g. S227230" autocomplete="username" autocapitalize="characters">
    <label>🔑 HRIS Password</label>
    <input id="pwd" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go">Login</button>
    <div class="err" id="loginErr"></div>
    <p class="note">🔒 ID/Password kothao save hoy na. Shudhu HRIS-e dhukte pathano hoy. Ei site shudhu dekhay, kono apply/save kore na.</p>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="attendance">📅 Attendance</button>
      <button class="tab" data-t="balance">🏖️ Leave</button>
      <button class="tab" data-t="payslip">💰 Salary</button>
      <button class="tab" data-t="purchase">🍽️ Canteen</button>
      <button class="tab" data-t="trend">📈 Trend</button>
      <button class="tab" data-t="iom">🕘 IOM</button>
    </div>
    <div class="card" id="barCard">
      <div class="bar">
        <div><label>Month</label><select id="month"></select></div>
        <div><label>Year</label><input id="year" type="number"></div>
        <button id="load">Show</button>
      </div>
    </div>
    <div class="err" id="err"></div>
    <div id="out"></div>
    <button class="link" id="logout">Logout</button>
  </div>
</div>

<script>
  // API ekii site-er moddhe, tai URL bodlate hobe na
  const API = "/api/hris";
  const $ = id => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const now = new Date();
  let cred = null;       // shudhu memory-te, page close korle chole jay
  let tab = "attendance";
  let cache = {};

  $("month").innerHTML = MONTHS.map((m,i)=>`<option value="${i+1}" ${i===now.getMonth()?"selected":""}>${m}</option>`).join("");
  $("year").value = now.getFullYear();
  try { $("uid").value = localStorage.getItem("srih_uid") || ""; } catch(e){}

  async function call(page, extra = {}) {
    const res = await fetch(API, { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ id: cred.id, pass: cred.pass, page, month: $("month").value, year: $("year").value, ...extra }) });
    let data; try { data = await res.json(); } catch { throw new Error("Server theke bhul uttor (" + res.status + ")"); }
    if (!res.ok || data.error) throw new Error(data.error || "Server error");
    return data;
  }

  function showErr(el, msg){ el.textContent = msg; el.style.display = msg ? "block" : "none"; }

  // ---- login = Attendance diye test kora ----
  $("go").onclick = async () => {
    const id = $("uid").value.trim(), pass = $("pwd").value;
    if (!id || !pass) return showErr($("loginErr"), "ID ar Password dao");
    showErr($("loginErr"), ""); $("go").disabled = true; $("go").textContent = "Loading...";
    cred = { id, pass };
    try {
      const d = await call("attendance");
      try { localStorage.setItem("srih_uid", id); } catch(e){}
      $("pwd").value = "";
      $("loginCard").style.display = "none"; $("app").style.display = "block"; setMini(1);
      cache = {}; cache["attendance|" + key()] = d;
      switchTab("attendance", true);
    } catch (e) {
      cred = null;
      showErr($("loginErr"), e.message === "Failed to fetch" ? "Server-e connect hocche na. Internet check koro." : e.message);
    }
    $("go").disabled = false; $("go").textContent = "Login";
  };
  $("pwd").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

  $("logout").onclick = () => { cred = null; cache = {}; $("out").innerHTML = ""; $("app").style.display = "none"; $("loginCard").style.display = "block"; setMini(0); };

  const key = () => $("month").value + "-" + $("year").value;

  document.querySelectorAll(".tab").forEach(b => b.onclick = () => switchTab(b.dataset.t));
  $("load").onclick = () => { delete cache[tab + "|" + key()]; switchTab(tab, true); };

  async function switchTab(t, force) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    $("barCard").style.display = (t === "balance" || t === "trend" || t === "iom") ? "none" : "block";
    showErr($("err"), "");
    const ck = t + "|" + key();
    if (cache[ck]) return render(t, cache[ck]);
    $("out").innerHTML = '<div class="loading">Loading...</div>';
    try {
      const d = await call(t);
      cache[ck] = d;
      if (tab === t) render(t, d);
    } catch (e) {
      if (tab === t) { $("out").innerHTML = ""; showErr($("err"), e.message); }
    }
  }

  const stat = (l,v,c) => `<div class="stat ${c}">${l}<b>${esc(v||0)}</b></div>`;

  function render(t, d) {
    if (t === "attendance") return renderAttendance(d);
    if (t === "balance") return renderBalance(d);
    if (t === "payslip") return renderPayslip(d);
    if (t === "purchase") return renderPurchase(d);
    if (t === "trend") return renderTrend(d);
    if (t === "iom") return renderIom(d);
  }

  function mins(t){const m=/(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(t||"");if(!m)return null;let h=+m[1];if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return h*60+ +m[2]}
  function stC(x){x=String(x||"").toLowerCase();return /absent/.test(x)?"--red":/late/.test(x)?"--amber":/^present/.test(x)?"--green":/leave/.test(x)?"--blue":/off|holiday/.test(x)?"--teal":/today/.test(x)?"--gold":"--muted"}
  function countUp(sel){document.querySelectorAll(sel).forEach(b=>{const t=+b.textContent;if(isNaN(t)||!t)return;const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/900);b.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})}
  function renderAttendance(d) {
    const s=d.summary||{},rows=d.rows||[],P=+s.present||0,L=Math.min(P,+s.late||0),ab=Math.max(0,(+s.absent||0)-(+d.futureAbsent||0)),lv=(+s.leaveWithPay||0)+(+s.leaveWithoutPay||0),H=+s.holiday||0;
    const seg=[[P-L,"--green","On-time"],[L,"--amber","Late"],[lv,"--blue","Leave"],[ab,"--red","Absent"],[H,"--teal","Holiday"]].filter(x=>x[0]>0),tot=seg.reduce((a,x)=>a+x[0],0)||1,C=2*Math.PI*54,g=seg.length>1?9:0;
    let acc=0;const arcs=seg.map(x=>{const l=C*x[0]/tot,o=acc*360/tot-90;acc+=x[0];return `<circle cx="70" cy="70" r="54" fill="none" stroke-width="14" stroke-linecap="round" stroke="var(${x[1]})" stroke-dasharray="0 ${C}" data-d="${Math.max(l-g,.1)} ${C}" transform="rotate(${o} 70 70)"/>`}).join("");
    const td=String(now.getDate()).padStart(2,"0")+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear();
    const tl=rows.map((r,i)=>{const p=String(r.date||"").split("/"),a=mins(r.inTime),b=mins(r.outTime),w=a!=null&&b!=null&&b>a?b-a:0,c=stC(r.status),isT=r.date===td;
      return `<div class="row${isT?" today":""}" style="--c:var(${isT?"--gold":c});--d:${Math.min(i*.04,1.2)}s"><div class="dt"><b>${esc(p[0]||"")}</b><span>${esc((MONTHS[(+p[1]||1)-1]||"").slice(0,3).toUpperCase())} · ${esc(String(r.day||"").slice(0,3).toUpperCase())}</span></div><div class="mid">${a!=null?esc(r.inTime)+" → "+esc(r.outTime||"–")+(w?`<small>${Math.floor(w/60)}h ${w%60}m kaj</small><div class="hb"><u data-w="${Math.min(100,w/7.2).toFixed(0)}"></u></div>`:""):"—<small>"+esc(r.status||"")+"</small>"}</div><span class="pill" style="background:var(${c})">${esc(r.status)}</span></div>`}).join("");
    $("out").innerHTML = `<div class="card rise"><div class="me"><div class="av"></div><div><div class="name">${esc(s.name||"My Attendance")}</div><div class="sub">Staff ID: ${esc(s.staffId||"-")} • Total Days: ${esc(s.totalDays||"-")}${s.payableDays?" • Payable: "+esc(s.payableDays):""}${s.lateMinutes?" • Late Min: "+esc(s.lateMinutes):""}</div></div></div></div>
      <div class="card rise" style="--d:.1s"><div class="sum"><div class="rg"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" fill="none" stroke="rgba(127,150,160,.25)" stroke-width="14"/>${arcs}</svg><div class="rc"><b>${P}</b><span>days present</span></div></div><div class="lg">${seg.map(x=>`<div><i style="background:var(${x[1]})"></i>${x[2]} · ${x[0]}</div>`).join("")}</div></div>
      <div class="grid">${stat("Present",s.present,"g")+stat("Absent",ab,"r")+stat("Late",s.late,"a")+stat("Leave (Pay)",s.leaveWithPay,"b")+stat("Leave (No Pay)",s.leaveWithoutPay,"p")+stat("Holiday",s.holiday,"s")}</div>
      ${(+d.futureAbsent>0)?`<div class="sub" style="margin-top:10px">ℹ️ HRIS-e Absent ${esc(s.absent)}, tar moddhe ${esc(d.futureAbsent)} din ekhono ashe ni (ajker por-er din), tai upore baad dewa hoyeche.</div>`:""}
      ${(+s.late>0)?`<div class="warn">⏰ Ei mash-e ${esc(s.late)} bar late${s.lateMinutes?" (mot "+esc(s.lateMinutes)+" minute)":""}</div>`:""}</div>
      <div class="card rise" style="--d:.2s"><h3>🧵 Daily timeline</h3><div class="tl">${tl||'<p class="sub">Kono record nai.</p>'}</div></div>`;
    setTimeout(()=>{document.querySelectorAll("#out circle[data-d]").forEach(c=>c.setAttribute("stroke-dasharray",c.dataset.d));document.querySelectorAll("#out .hb u").forEach(u=>u.style.width=u.dataset.w+"%")},120);
    countUp("#out .stat b");
  }

  function chipCls(st) { st = String(st||"").toLowerCase(); return /approv/.test(st) ? "c-g" : /reject|cancel|den|declin/.test(st) ? "c-r" : "c-a"; }
  function histCards(hh) {
    const H = (hh && hh.headers) || [], R = (hh && hh.rows) || [];
    if (!R.length) return '<p class="sub" style="margin-top:10px">Kono history pai ni.</p>';
    const idx = re => H.findIndex(x => re.test(x));
    const iF = idx(/from/i), iT = idx(/^to/i), iS = idx(/status/i), iR = idx(/reason/i);
    return R.map(r => {
      const from = r[iF >= 0 ? iF : 0], to = r[iT >= 0 ? iT : 1];
      const st = iS >= 0 ? r[iS] : "";
      const skip = new Set([iF >= 0 ? iF : 0, iT >= 0 ? iT : 1, iS, iR]);
      const meta = r.map((v, i) => skip.has(i) || !v ? null : (H[i] ? H[i] + ": " : "") + v).filter(Boolean).join(" • ");
      return `<div class="hcard"><div class="htop"><span>${esc(from)}${to && to !== from ? " → " + esc(to) : ""}</span>${st ? `<span class="chip ${chipCls(st)}">${esc(st)}</span>` : ""}</div>${iR >= 0 && r[iR] ? `<div class="hrs">${esc(r[iR])}</div>` : ""}<div class="hmeta">${esc(meta)}</div></div>`;
    }).join("");
  }
  const HRIS_LEAVE = "http://hris.prangroup.com:8686/Pages/Portal/QLvApplication.aspx";
  const HRIS_IOM = "http://hris.prangroup.com:8686/Pages/Portal/QPersonalIOM.aspx";

  function renderBalance(d) {
    $("out").innerHTML = `<div class="card">
      <div class="name">Leave Balance</div>
      <div class="kv"><span>Balance</span><span>${esc(d.balance||"-")}</span></div>
      <div class="kv"><span>Entitled</span><span>${esc(d.entitled||"-")}</span></div>
      <div class="kv"><span>First Approver</span><span>${esc(d.firstApprover||"-")}</span></div>
      <div class="kv"><span>Final Approver</span><span>${esc(d.finalApprover||"-")}</span></div>
      <a class="ext" href="${HRIS_LEAVE}" target="_blank" rel="noopener">HRIS-e Leave apply koro ↗</a></div>
      <div class="card"><div class="name">Leave history</div>${histCards(d.history)}</div>`;
  }

  function renderIom(d) {
    $("out").innerHTML = `<div class="card"><div class="name">IOM history</div>${histCards(d)}
      <a class="ext" href="${HRIS_IOM}" target="_blank" rel="noopener">HRIS-e IOM apply koro ↗</a></div>`;
  }

  function renderPayslip(d) {
    const rows = a => a.map(r => `<div class="kv"><span>${esc(r.name)}</span><span>${esc(r.amount)}</span></div>`).join("") || '<div class="kv"><span>-</span><span></span></div>';
    $("out").innerHTML = `<div class="card">
      <div class="name">${esc(d.name||"Salary")}</div>
      <div class="sub">${esc(d.title||"")}${d.department?" • "+esc(d.department):""}${d.attendance?" • Attendance: "+esc(d.attendance):""}</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">${stat("Allowance",d.totalAllowance,"g")+stat("Deduction",d.totalDeduction,"r")+stat("Net",d.net,"b")}</div>
      <h4>Allowance</h4>${rows(d.allowance||[])}
      <h4>Deduction</h4>${rows(d.deduction||[])}</div>`;
  }


  function renderTrend(d) {
    const ms = d.months || [];
    const rows = ms.map(m => {
      const ab = Math.max(0, m.absent - (m.future || 0));
      const tot = (m.present + ab + m.leave + m.holiday) || 1;
      const w = n => (n * 100 / tot).toFixed(1) + "%";
      return `<div class="mrow"><div class="mhead">${esc(m.label)}<span>${m.ok ? "Late: " + m.late + (m.lateMinutes ? " (" + m.lateMinutes + " min)" : "") : "data nai"}</span></div>
        <div class="bar2"><i style="width:${w(m.present)};background:var(--green)"></i><i style="width:${w(m.leave)};background:var(--blue)"></i><i style="width:${w(m.holiday)};background:var(--teal)"></i><i style="width:${w(ab)};background:var(--red)"></i></div>
        <div class="leg"><span><b style="background:var(--green)"></b>Present ${m.present}</span><span><b style="background:var(--red)"></b>Absent ${ab}</span><span><b style="background:var(--blue)"></b>Leave ${m.leave}</span><span><b style="background:var(--teal)"></b>Holiday ${m.holiday}</span></div></div>`;
    }).join("");
    $("out").innerHTML = `<div class="card"><div class="name">Last 4 mash</div><div class="sub">Present, Absent, Leave ar Holiday-r tulona</div>${rows}</div>`;
  }

  function renderPurchase(d) {
    const items = d.items || [];
    const opts = (d.subheads||[]).map(s => `<option value="${esc(s.value)}" ${s.value===d.subhead?"selected":""}>${esc(s.name)}</option>`).join("");
    const body = items.map(r => `<tr><td>${esc(r.date.slice(0,10))}<br><span style="color:var(--muted)">${esc(r.date.slice(11,16))}</span></td><td style="white-space:normal">${esc(r.item)}</td><td class="n">${esc(r.qty)}</td><td class="n">${esc(r.amount)}</td></tr>`).join("");
    $("out").innerHTML = `<div class="card">
      <div class="name">Canteen / Purchase</div>
      <div class="big">৳ ${esc(d.total)}</div>
      <div class="sub">${items.length} ti item</div>
      ${opts ? `<label>Sub Head</label><select id="sh">${opts}</select>` : ""}
      <div class="tw"><table><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${body || '<tr><td colspan="4" style="text-align:center;padding:20px">Kono data nai</td></tr>'}</tbody></table></div></div>`;
    const sh = $("sh");
    if (sh) sh.onchange = async () => {
      $("out").innerHTML = '<div class="loading">Loading...</div>';
      try { const nd = await call("purchase", { subhead: sh.value }); cache["purchase|" + key()] = nd; renderPurchase(nd); }
      catch (e) { showErr($("err"), e.message); }
    };
  }

  // ---- 3D hero + theme ----
  function setMini(on){document.querySelector(".wrap").classList.toggle("mini",!!on);scrollTo(0,0)}
  (function(){const r=document.documentElement;try{const v=localStorage.getItem("srih_theme");if(v)r.dataset.theme=v}catch(e){}
    $("thm").onclick=()=>{const d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches,v=d?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("srih_theme",v)}catch(e){}};
    const T=$("tl"),S=$("st");
    function set(rx,ry,mx,my){T.style.setProperty("--rx",rx+"deg");T.style.setProperty("--ry",ry+"deg");T.style.setProperty("--mx",mx+"%");T.style.setProperty("--my",my+"%")}
    function pt(e){const t=e.touches?e.touches[0]:e,b=S.getBoundingClientRect(),x=(t.clientX-b.left)/b.width,y=(t.clientY-b.top)/b.height;set(((.5-y)*26).toFixed(1),((x-.5)*30).toFixed(1),(x*100).toFixed(0),(y*100).toFixed(0))}
    ["pointermove","touchmove","touchstart"].forEach(n=>S.addEventListener(n,pt,{passive:true}));
    ["pointerleave","touchend"].forEach(n=>S.addEventListener(n,()=>set(0,0,30,15)));
    addEventListener("deviceorientation",e=>{if(e.gamma==null)return;const rx=Math.max(-10,Math.min(10,(e.beta-55)/4)),ry=Math.max(-14,Math.min(14,e.gamma/3));set(rx.toFixed(1),ry.toFixed(1),(50+ry*3).toFixed(0),(30-rx*3).toFixed(0))});
  })();
</script>
</body>
</html>
